pluginManagement {
    includeBuild("build-logic")
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
include ':baselineprofile'
include ':smoke:kmp-probe'
include ':smoke:network-kmp-probe'
include ':smoke:rhino-capability-probe'
include ':smoke:room-kmp-probe'
include ':smoke:compose-desktop-probe'
include ':host:desktop'
include ':feature:reader:core'
include ':feature:about'
include ':feature:tagrules'
include ':feature:replacerules'
include ':feature:dict'
include ':feature:txttocrules'
include ':core:platform'
include ':core:model'
include ':core:data'
include ':core:designsystem'
include ':core:ui'
include ':core:viewmodel'
// M3-1：`core:data` 按域拆分的第一个样板（替换规则域）。domain 只放领域模型与 port，
// data 放实现与 mapper —— 过渡期 data 依赖 `:core:data` 取 Room 的 DAO/实体会话，
// 待 `data:database` 成为 Room 唯一 owner 后再改为依赖它（见迁移计划 M3）。
include ':domain:rules'
include ':data:rules'
// M4-1：`core:data` 按域拆分的第一个**非 rules** 域（AI 提示词预设）。形态与 M3 同构：
// domain 只放领域模型与 port，data 放实现与 mapper —— 过渡期 data 依赖 `:core:data`
// 取 Room 的 DAO/实体，待 `data:database` 成为 Room 唯一 owner 后再改为依赖它。
include ':domain:ai'
include ':data:ai'
project(':baselineprofile').projectDir = file('baselineProfile')
