pluginManagement {
    includeBuild("build-logic")
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
include ':baselineprofile'
include ':smoke:kmp-probe'
include ':smoke:network-kmp-probe'
include ':smoke:rhino-capability-probe'
include ':smoke:room-kmp-probe'
include ':smoke:compose-desktop-probe'
include ':host:desktop'
include ':feature:reader:core'
include ':feature:about'
include ':feature:settings'
include ':feature:tagrules'
include ':feature:replacerules'
include ':feature:dict'
include ':feature:txttocrules'
include ':core:platform'
include ':core:model'
include ':core:data'
include ':core:designsystem'
include ':core:ui'
include ':core:viewmodel'
// M3-1：`core:data` 按域拆分的第一个样板（替换规则域）。domain 只放领域模型与 port，
// data 放实现与 mapper —— 过渡期 data 依赖 `:core:data` 取 Room 的 DAO/实体会话，
// 待 `data:database` 成为 Room 唯一 owner 后再改为依赖它（见迁移计划 M3）。
include ':domain:rules'
include ':data:rules'
// M4-1：`core:data` 按域拆分的第一个**非 rules** 域（AI 提示词预设）。形态与 M3 同构：
// domain 只放领域模型与 port，data 放实现与 mapper —— 过渡期 data 依赖 `:core:data`
// 取 Room 的 DAO/实体，待 `data:database` 成为 Room 唯一 owner 后再改为依赖它。
include ':domain:ai'
include ':data:ai'
// M4-6：`core:data` 按域拆分的第四个域（用户划线/高亮笔记，book_marks 表）。形态与
// M3/M4 同构：domain 只放领域模型与 port，data 放实现与 mapper —— 过渡期 data 依赖
// `:core:data` 取 Room 的 DAO/实体，待 `data:database` 成为 Room 唯一 owner 后再改。
include ':domain:marking'
include ':data:marking'
// M4-7：首页模块域（homepage_modules / homepage_custom_sets）。形态与 M3/M4 同构。
// ⚠️ 本域的**领域模型**（`ModuleItem` / `CustomSetItem`）已住 `:core:model` 的
// `io.legado.app.domain.model`（共享层），本片**不搬它们**——只搬端口与实现。
include ':domain:homepage'
include ':data:homepage'
// M4-8：正文处理域（book_content_processes）。除领域模型与端口外，**纯函数引擎**
// `BookContentProcessEngine` 也一并从 `:core:data` 的 `domain/model` 搬进来（它只依赖
// `JsonCodec` 与 `:core:model` 的锚点/动作类型，属 domain 层）。
include ':domain:contentprocess'
include ':data:contentprocess'
project(':baselineprofile').projectDir = file('baselineProfile')
