name: Verify

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 auto-release.yml 同一处理：settings.gradle 里的 aliyun 镜像面向国内开发机，
      # 在 GitHub runner 上会 502，且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Run Android baseline and KMP reader-core checks
        run: |
          chmod +x gradlew
          ./gradlew \
            testAppDebugUnitTest \
            lintAppDebug \
            verifyConfigArchitecture \
            checkSharedPurity \
            checkModuleDependencies \
            assembleAppDebug \
            :smoke:kmp-probe:compileCommonMainKotlinMetadata \
            :smoke:kmp-probe:compileAndroidMain \
            :smoke:kmp-probe:compileKotlinDesktop \
            :smoke:kmp-probe:desktopTest \
            :smoke:kmp-probe:testAndroidHostTest \
            :smoke:network-kmp-probe:compileCommonMainKotlinMetadata \
            :smoke:network-kmp-probe:compileKotlinDesktop \
            :smoke:network-kmp-probe:desktopTest \
            :smoke:network-kmp-probe:testAndroidHostTest \
            :smoke:rhino-capability-probe:compileCommonMainKotlinMetadata \
            :smoke:rhino-capability-probe:compileKotlinDesktop \
            :smoke:rhino-capability-probe:desktopTest \
            :smoke:rhino-capability-probe:testAndroidHostTest \
            :smoke:room-kmp-probe:compileCommonMainKotlinMetadata \
            :smoke:room-kmp-probe:compileKotlinDesktop \
            :smoke:room-kmp-probe:desktopTest \
            :feature:reader:core:compileCommonMainKotlinMetadata \
            :feature:reader:core:compileAndroidMain \
            :feature:reader:core:compileKotlinDesktop \
            :feature:reader:core:desktopTest \
            :feature:reader:core:testAndroidHostTest \
            :core:platform:compileCommonMainKotlinMetadata \
            :core:platform:compileAndroidMain \
            :core:platform:compileKotlinDesktop \
            :core:platform:desktopTest \
            :core:platform:testAndroidHostTest \
            :core:model:compileCommonMainKotlinMetadata \
            :core:model:compileAndroidMain \
            :core:model:compileKotlinDesktop \
            :core:model:desktopTest \
            :core:model:testAndroidHostTest \
            :core:data:compileCommonMainKotlinMetadata \
            :core:data:compileAndroidMain \
            :core:data:compileKotlinDesktop \
            :core:data:desktopTest \
            :core:data:testAndroidHostTest \
            :core:ui:compileDebugKotlin \
            :core:ui:testDebugUnitTest \
            :core:viewmodel:compileDebugKotlin \
            :core:viewmodel:testDebugUnitTest \
            --continue \
            --no-daemon \
            --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports
          if-no-files-found: warn
          path: |
            app/build/test-results/testAppDebugUnitTest/**
            app/build/reports/tests/testAppDebugUnitTest/**
            smoke/kmp-probe/build/test-results/**
            smoke/kmp-probe/build/reports/tests/**
            smoke/network-kmp-probe/build/test-results/**
            smoke/network-kmp-probe/build/reports/tests/**
            smoke/rhino-capability-probe/build/test-results/**
            smoke/rhino-capability-probe/build/reports/tests/**
            smoke/room-kmp-probe/build/test-results/**
            smoke/room-kmp-probe/build/reports/tests/**
            feature/reader/core/build/test-results/**
            feature/reader/core/build/reports/tests/**
            core/platform/build/test-results/**
            core/platform/build/reports/tests/**
            core/model/build/test-results/**
            core/model/build/reports/tests/**
            core/ui/build/test-results/**
            core/ui/build/reports/tests/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-appDebug.html
            app/build/reports/lint-results-appDebug.xml
            app/build/reports/lint-results-appDebug.txt
            app/build/reports/lint-results-appDebug.sarif
