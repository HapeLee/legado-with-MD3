name: Prepare pinned UI forks
description: Build pinned COUI and Mochi artifacts for this job without publishing credentials
runs:
  using: composite
  steps:
    - name: Install Android SDK platforms
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: 'platform-tools platforms;android-36 platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 build-tools;37.0.0'
    - name: Build pinned UI artifacts
      shell: bash
      run: python3 scripts/prepare-ui-forks.py
