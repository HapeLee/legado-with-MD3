# CMP 版本（声明处之一）。另一处是 build-logic 里 compose-gradle-plugin 的版本；
# convention `legado.kmp.compose` 在配置期断言两处相等，漂了就失败。
composeMultiplatform = "1.12.0"
# CMP 模块 commonMain 用的 lifecycle 版本：与 android-only 侧的
# `lifecycleViewmodelCompose` 同一个值，两条线在 Android 上收敛到同一套 androidx 实现。
lifecycleKmp = "2.11.0"
# CMP material3 的版本**不是**插件版本号。插件常量
# `ComposeBuildConfig.composeMaterial3Version` 语义是「material3 的最新 stable」，目前停在
# 1.9.0；但 1.9.0 把 expressive 系列（`MaterialExpressiveTheme` / `MotionScheme` /
# `@ExperimentalMaterial3ExpressiveApi`）标成了 `internal`，跨模块用不了（编译报
# "it is internal in file"）。上游源码实测的放开点：**1.10.0-alpha05** 起上述三个转 public，
# **1.11.0-alpha07** 起有 `modalWindowInsets`，**1.12.0-alpha03** 起有 `rememberBottomSheetState`。
# 因此这里**有意偏离插件常量**，取「满足全部 expressive 需求的最低版本」；该偏离不是随手挑
# alpha，而是由 convention 的 `MATERIAL3_PIN` 显式登记并断言——改了这里却不同步登记就失败。
composeMultiplatformMaterial3 = "1.12.0-alpha03"
