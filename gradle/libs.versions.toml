# CMP（commonMain）用的 material3：**真 KMP 模块**，android/desktop/ios/js/wasm 都有产物；
# 其 android 变体是**纯转发空壳**（classes.jar 里没有任何 material3 类），内部用 **`strictly`**
# 委托 `androidx.compose.material3:material3`（Google 那份），于是「在 android 上最终就是
# AndroidX Material3」——平台解析由 CMP 负责，不用手工分支。**那条 strictly 会钉死 androidx
# 版本**，所以只在 CMP 模块里用本坐标；android-only 的模块走上面 `material3` 那条。
compose-multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
# CMP（commonMain）用的 animation：`modalBottomSheet/AppModalBottomSheet.kt` 要用
# `Modifier.animateContentSize`（`androidx.compose.animation` 包的顶层扩展，M1-3h 搬入）。
# foundation 会传递带上它，但按本仓「依赖只列实际用到的」约定显式声明，不赖传递闭包。
compose-multiplatform-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }
# CMP 多平台资源（`org.jetbrains.compose.resources`，M1-3j 引入）。CMP 模块的
# `composeResources/` 目录由它编译/打包，生成 `Res` 访问器对象（包名在模块侧用
# `compose.resources { packageOfResClass }` 显式指定）：
#   - `@Composable fun stringResource(Res.string.x)` —— 替代 android-only 的
#     `androidx.compose.ui.res.stringResource`（后者在 desktop 不存在）；
#   - 版本必须与 CMP 插件严格同线，故 ref `composeMultiplatform`（convention 已在
#     配置期断言该值等于插件常量）；
#   - **不参与 Android 资源合并**：`composeResources/values*` 打进 assets 由 Res 读取，
#     与被 app 覆盖无关，所以共享层必须自带全部语言目录，不能只放默认值。
compose-multiplatform-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
# CMP UI 测试（`org.jetbrains.compose.ui:ui-test-*`），M1-4 引入。
# 用途：`desktopTest` 里用 `runComposeUiTest` 真实渲染 commonMain 的 CMP 代码并断言，
# 让 desktop 证据不再止于「能编译」。三个注意点：
#   - 版本 ref `composeMultiplatform`：必须与 CMP 插件严格同线（理由同 resources）；
#   - 只有 `ui-test-junit4`（JUnit4 驱动）。CMP **没有** AndroidX 那套
#     `createComposeRule` / `ComposeContentTestRule`，用的是 `runComposeUiTest`；
#   - desktop 上还要配 `compose.desktop.currentOs` 提供 Skiko 渲染运行时，否则测不出画面。
compose-multiplatform-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
# CMP（commonMain）用的 lifecycle：**这就是坐标本身，KMP 发布带 `-desktop` 变体**
# （与 `androidx-lifecycle-viewmodel` 那条 `-android` 后端壳不同，后者只能给
# android-only 模块）。M1-3w 引入：tagrules 的 VM 在 commonMain，要
# `ViewModel` / `viewModelScope` 与 `collectAsStateWithLifecycle`（Route 侧）。
# ⚠️ 别换 `org.jetbrains.androidx.lifecycle` 那套 CMP 移植坐标：它 2.9.6 的元数据
# `requires androidx.lifecycle:…:2.9.4`，而本地只有 2.11.0 的 `-desktop` jar，
# 会去网上拉 2.9.4（内网/代理不可用时直接解析失败）。本仓已有的这一条 2.11.0
# 与 Android 侧版本同号，desktop 变体（`lifecycle-viewmodel-desktop` /
# `lifecycle-runtime-compose-desktop`）实测三件齐全。
