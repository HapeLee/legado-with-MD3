# 1.2.0-alpha02 修复了预测式返回手势中 NavigationEventInput.dispatchOnBackProgressed
# 对已分离输入抛 IllegalStateException 的崩溃（1.1.x 仍会 checkNotNull 抛异常）。
# navigation3 1.2.0-beta01 传递的是 navigationevent 1.1.1（仍未含该修复），故继续手动抬高，
# 等上游传递版本 ≥ 1.2.0-alpha02 后可移除本覆盖。
navigationevent = "1.2.0-alpha04"
markwon = "4.6.2"
material = "1.14.0"
# androidx material3，**只给 android-only 模块**用（app / core:ui / feature:*）。
# 它的版本线与 **compose 版本线绑定**：本值属于 compose 1.12.0 线（与 `composeBom` /
# `foundation` / `runtime` 同线）。⚠️ 既不要把它「以 CMP 为基准同步」，也不要为了「只留一个
# 版本号」删掉本条改用 CMP 坐标——两条路都实测过（见 .workbuddy/memory/2026-09-10.md）：
#   - CMP pin 停在 1.12.0-alpha03 ⇒ android 侧**降级**到 1.5.0-alpha22（`core:ui` 编译失败）；
#   - CMP pin 抬到 1.13.0-alpha01 ⇒ material3 拿到 alpha27，但**整条 compose 栈被抬到
#     1.13.0-alpha02**（`composeBom` 与各 pin 全失效，实测 `:app:dependencies`）。
# 抬升的**准确归因**（2026-09-10 复测）：来自 **CMP 整条制品线同版本发布**——CMP material3 的
# commonMain 元数据要求 `org.jetbrains.compose.foundation/runtime/ui` = 1.13.0-alpha01，其 android
# 变体再转发给 androidx；**不是** androidx material3 自己要 1.13.0-alpha02（alpha27 的 android
# 变体只要 compose **1.12.0-beta01**，所以本条其实可以独立小步升）。
# 注意 alpha28 起 foundation 被要求到 1.13.0-alpha01，同样撕裂栈 ⇒ 要留在 1.12.0 线就止步 alpha27。
# 两侧是**不同的版本体系**，数字永久不可能相等；现状自洽：android 侧只解析出一个 material3。
material3 = "1.5.0-alpha23"
